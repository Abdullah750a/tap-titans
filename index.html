<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Titans - Abdullah</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
body{background:#0d0d1f;color:#fff;font-family:Arial;text-align:center;overflow:hidden}
.top{background:#1c1c3a;padding:12px;display:flex;justify-content:space-around;font-weight:bold}
.boss-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:55vh}
.boss{font-size:130px;cursor:pointer;user-select:none;-webkit-user-select:none}
.boss:active{transform:scale(0.85)}
.hp-bar{width:85%;height:22px;background:#222;border-radius:10px;overflow:hidden;margin-top:15px;border:2px solid #555}
.hp-fill{height:100%;background:linear-gradient(90deg,#ff3b3b,#ff9a00);width:100%;transition:width 0.1s}
.btns{background:#15152e;padding:10px;display:flex;gap:8px;overflow-x:auto}
.card{background:#24244a;padding:10px;border-radius:10px;min-width:130px;flex:1}
.card b{font-size:14px}
.card button{background:linear-gradient(90deg,#7c4dff,#4a00e0);color:#fff;border:none;padding:6px 10px;border-radius:6px;margin-top:6px;width:100%;font-weight:bold}
.gold{color:#ffd32a;font-size:13px;margin:4px 0}
#stage{font-size:18px;font-weight:bold;letter-spacing:1px;margin:10px}
</style>
</head>
<body>
<div class="top">
<div>💰 <span id="gold">0</span></div>
<div>👆 <span id="tapdmg">15</span> DMG</div>
<div>⚔️ Stage <span id="level">1</span></div>
</div>
<div id="stage">TITAN SLAYER</div>
<div class="boss-area">
<div class="boss" id="boss" onclick="tap()">👹</div>
<div class="hp-bar"><div class="hp-fill" id="hp"></div></div>
<div id="hpText" style="margin-top:5px">100 / 100</div>
</div>
<div class="btns">
<div class="card"><b>Tap Power</b><div class="gold">Cost: <span id="c1">50</span></div><button onclick="buy(0)">BUY +5</button></div>
<div class="card"><b>Warrior Hero</b><div class="gold">Cost: <span id="c2">150</span></div><div class="gold">+2/sec</div><button onclick="buy(1)">BUY</button></div>
<div class="card"><b>Mage Hero</b><div class="gold">Cost: <span id="c3">450</span></div><div class="gold">+8/sec</div><button onclick="buy(2)">BUY</button></div>
</div>
<script>
let gold=0,tapDmg=15,level=1,hp=100,maxHp=100,costs=[50,150,450],dps=[0,0,0]
const bosses=["👹","👺","👿","💀","👾","🤖","🐲","👑
