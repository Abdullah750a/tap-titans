<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tap Titans</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
body{background:#0d0d1f;color:#fff;font-family:Arial;text-align:center;height:100vh;overflow:hidden}
.top{background:#1c1c3a;padding:12px;display:flex;justify-content:space-around;font-weight:bold;font-size:16px}
#stage{margin:10px;font-weight:bold;letter-spacing:2px}
.boss-area{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh}
#boss{font-size:140px;cursor:pointer;transition:transform 0.05s}
#boss:active{transform:scale(0.8)}
.hp-bar{width:85%;height:22px;background:#222;border-radius:10px;overflow:hidden;margin-top:15px;border:2px solid #555}
.hp-fill{height:100%;background:linear-gradient(90deg,#ff3b3b,#ff9a00);width:100%}
.btns{position:fixed;bottom:0;left:0;right:0;background:#15152e;padding:10px;display:flex;gap:8px}
.card{background:#24244a;padding:10px;border-radius:10px;flex:1}
.card button{background:#7c4dff;color:#fff;border:none;padding:8px;border-radius:6px;width:100%;font-weight:bold;margin-top:5px}
.gold{color:#ffd32a;font-size:13px}
</style>
</head>
<body>
<div class="top"><div>💰 <span id="gold">0</span></div><div>👆 <span id="tapdmg">15</span> DMG</div><div>⚔️ Stage <span id="level">1</span></div></div>
<div id="stage">TITAN SLAYER</div>
<div class="boss-area">
<div id="boss">👹</div>
<div class="hp-bar"><div class="hp-fill" id="hp"></div></div>
<div id="hpText" style="margin-top:6px">100 / 100</div>
</div>
<div class="btns">
<div class="card"><b>Tap Power</b><div class="gold">Cost: <span id="c1">50</span></div><button onclick="buy(0)">BUY +5</button></div>
<div class="card"><b>Warrior</b><div class="gold">Cost: <span id="c2">150</span></div><div class="gold">+2/sec</div><button onclick="buy(1)">BUY</button></div>
<div class="card"><b>Mage</b><div class="gold">Cost: <span id="c3">450</span></div><div class="gold">+8/sec</div><button onclick="buy(2)">BUY</button></div>
</div>
<script>
let gold=0,tapDmg=15,level=1,hp=100,maxHp=100,costs=[50,150,450],dps=[0,0,0];
const bosses=["👹","👺","👿","💀","👾","🤖","🐲","👑"];
function upd(){
document.getElementById('gold').innerText=Math.floor(gold);
document.getElementById('tapdmg').innerText=tapDmg;
document.getElementById('level').innerText=level;
document.getElementById('hp').style.width=(hp/maxHp*100)+"%";
document.getElementById('hpText').innerText=Math.floor(hp)+" / "+maxHp;
document.getElementById('c1').innerText=costs[0];
document.getElementById('c2').innerText=costs[1];
document.getElementById('c3').innerText=costs[2];
}
function doTap(){
hp-=tapDmg;
if(hp<=0){gold+=level*25;level++;maxHp=Math.floor(maxHp*1.4);hp=maxHp;document.getElementById('boss').innerText=bosses[level%bosses.length];}
upd();
}
function buy(i){
if(gold>=costs[i]){
gold-=costs[i];
if(i==0){tapDmg+=5;costs[0]=Math.floor(costs[0]*1.5)}
if(i==1){dps[1]+=2;costs[1]=Math.floor(costs[1]*1.6)}
if(i==2){dps[2]+=8;costs[2]=Math.floor(costs[2]*1.7)}
upd();
}
}
let bossEl=document.getElementById('boss');
bossEl.addEventListener('touchstart',function(e){e.preventDefault();doTap();});
bossEl.addEventListener('click',function(e){doTap();});
setInterval(()=>{let d=dps[1]+dps[2];if(d>0){hp-=d;if(hp<=0){gold+=level*25;level++;maxHp=Math.floor(maxHp*1.4);hp=maxHp;bossEl.innerText=bosses[level%bosses.length]}upd()}},1000);
upd();
</script>
</body>
</html>
